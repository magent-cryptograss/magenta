" width="33.02" height="23.4" fill="none" stroke="#8a5d1f" stroke-width="0.6" rx="1.56" opacity="0.3"/><line x1="1060.4" y1="317.05" x2="1060.4" y2="344.35" stroke="#8a5d1f" stroke-width="1.95" stroke-linecap="round"/><rect x="1042.59" y="321.08" width="5.72" height="19.24" fill="#8a5d1f" rx="2.86" opacity="0.85"/><circle cx="1045.45" cy="330.7" r="4.42" fill="#8a5d1f"/><line x1="1093.94" y1="327.32" x2="1099.4" y2="322.12" stroke="#8a5d1f" stroke-width="2" stroke-linecap="round"/><circle cx="1099.4" cy="322.12" r="2.08" fill="#8a5d1f"/><line x1="1093.94" y1="334.08" x2="1099.4" y2="339.28" stroke="#8a5d1f" stroke-width="2" stroke-linecap="round"/><circle cx="1099.4" cy="339.28" r="2.08" fill="#8a5d1f"/><circle cx="1091.6" cy="330.7" r="5.2" fill="#8a5d1f"/></g><text x="848" y="252.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#a15c00" font-weight="bold">the driver must cross the centre line to pass</text><line x1="1076" y1="346.3" x2="1076" y2="365.8" stroke="#8a5d1f" stroke-width="1.3" stroke-dasharray="4 3"/><text x="1076" y="378.8" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" fill="#8a5d1f" font-weight="bold" text-anchor="middle">the rider being sheltered</text><rect x="840" y="593" width="396" height="96" fill="#e4f2ee" stroke="#14866d" stroke-width="1.4" rx="4"/><text x="854" y="619" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#14866d" font-weight="bold">The street works for everyone</text><text x="854" y="643" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">The strong riders spend the risk. The slow,</text><text x="854" y="662" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">the young and the old get a lane that is</text><text x="854" y="681" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">calm enough to use.</text><line x1="24" y1="746" x2="1236" y2="746" stroke="#c8ccd1" stroke-width="1"/><text x="24" y="768" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#72777d" font-style="italic">Plan view, drawn to scale, same 8 ft / 5 ft / 11 ft street as the previous figure. Clearances measured from the outside of the handlebar.</text></svg>