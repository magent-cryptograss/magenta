</defs><rect x="0" y="0" width="1260" height="792" fill="#ffffff"/><text x="630" y="46" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="27" fill="#202122" font-weight="bold" text-anchor="middle">Where you ride decides how you are passed</text><text x="630" y="72" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#54595d" text-anchor="middle">The same street in all three panels. Only the rider’s position changes — and with it, what the driver behind has to do.</text><circle cx="37" cy="104" r="12" fill="#202122"/><text x="37" y="109" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="58" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#202122" font-weight="bold">Riding the paint</text><text x="24" y="134" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#54595d">Rider in the centre of the marked lane</text><g clip-path="url(#c1)"><rect x="24" y="150" width="396" height="91" fill="#dcdcd8"/><rect x="24" y="241" width="396" height="143" fill="#dcdcd8"/><rect x="24" y="384" width="396" height="65" fill="#e4f2ee"/><rect x="24" y="449" width="396" height="104" fill="#d0d0cb"/><rect x="24" y="553" width="396" height="22" fill="url(#hw)"/><line x1="24" y1="553" x2="420" y2="553" stroke="#a2a9b1" stroke-width="2.5"/><line x1="24" y1="449" x2="420" y2="449" stroke="#ffffff" stroke-width="3"/><line x1="24" y1="384" x2="420" y2="384" stroke="#ffffff" stroke-width="3"/><line x1="24" y1="241" x2="420" y2="241" stroke="#e8c44a" stroke-width="2.5" stroke-dasharray="18 12"/><rect x="32" y="468.5" width="208" height="78" fill="#6c7b8b" rx="6"/><rect x="94.4" y="472.5" width="70.72" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><rect x="279" y="468.5" width="208" height="78" fill="#8a97a4" rx="6"/><rect x="341.4" y="472.5" width="70.72" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><rect x="24" y="423" width="396" height="45.5" fill="url(#hr)"/><rect x="24" y="400.25" width="396" height="32.5" fill="#e3ecfa" opacity="0.8"/><rect x="24" y="423" width="396" height="9.75" fill="#b32424" opacity="0.4"/><rect x="162" y="299.5" width="221" height="78" fill="#6c7b8b" rx="6"/><rect x="228.3" y="303.5" width="75.14" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><text x="272.5" y="342.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">no lane change</text><line x1="241.5" y1="416.5" x2="306.5" y2="416.5" stroke="#16365c" stroke-width="1.105" stroke-linecap="round"/><rect x="236.3" y="414.68" width="29.25" height="3.64" fill="#16365c" rx="1.8200000000000003"/><rect x="282.45" y="414.68" width="29.25" height="3.64" fill="#16365c" rx="1.8200000000000003"/><line x1="280.5" y1="404.8" x2="280.5" y2="428.2" stroke="#16365c" stroke-width="1.8200000000000003" stroke-linecap="round"/><rect x="258.14" y="406.88" width="5.72" height="19.24" fill="#16365c" rx="2.86" opacity="0.85"/><circle cx="261" cy="416.5" r="4.42" fill="#16365c"/></g><line x1="335" y1="377.5" x2="345" y2="377.5" stroke="#b32424" stroke-width="1"/><line x1="335" y1="400.25" x2="345" y2="400.25" stroke="#b32424" stroke-width="1"/><line x1="340" y1="377.5" x2="340" y2="400.25" stroke="#b32424" stroke-width="1"/><path d="M340 377.5 l -3 6 l 6 0 z" fill="#b32424"/><path d="M340 400.25 l -3 -6 l 6 0 z" fill="#b32424"/><text x="350" y="393.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b32424" font-weight="bold">1¾ ft</text><rect x="24" y="593" width="396" height="96" fill="#fbe7e6" stroke="#b32424" stroke-width="1.4" rx="4"/><text x="38" y="619" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#b32424" font-weight="bold">The driver does nothing</text><text x="38" y="643" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">Passing costs the driver no time and no</text><text x="38" y="662" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">attention, so nothing about the street</text><text x="38" y="681" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">gets slower or calmer.</text><circle cx="445" cy="104" r="12" fill="#202122"/><text x="445" y="109" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="466" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#202122" font-weight="bold">Taking the lane</text><text x="432" y="134" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#54595d">Rider in the centre of the travel lane</text><g clip-path="url(#c2)"><rect x="432" y="150" width="396" height="91" fill="#dcdcd8"/><rect x="432" y="241" width="396" height="143" fill="#dcdcd8"/><rect x="432" y="384" width="396" height="65" fill="#e4f2ee"/><rect x="432" y="449" width="396" height="104" fill="#d0d0cb"/><rect x="432" y="553" width="396" height="22" fill="url(#hw)"/><line x1="432" y1="553" x2="828" y2="553" stroke="#a2a9b1" stroke-width="2.5"/><line x1="432" y1="449" x2="828" y2="449" stroke="#ffffff" stroke-width="3"/><line x1="432" y1="384" x2="828" y2="384" stroke="#ffffff" stroke-width="3"/><line x1="432" y1="241" x2="828" y2="241" stroke="#e8c44a" stroke-width="2.5" stroke-dasharray="18 12"/><rect x="440" y="468.5" width="208" height="78" fill="#6c7b8b" rx="6"/><rect x="502.4" y="472.5" width="70.72" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><rect x="687" y="468.5" width="208" height="78" fill="#8a97a4" rx="6"/><rect x="749.4" y="472.5" width="70.72" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><rect x="432" y="423" width="396" height="45.5" fill="url(#hr)"/><rect x="432" y="296.25" width="396" height="32.5" fill="#e3ecfa" opacity="0.8"/><rect x="570" y="156.5" width="221" height="78" fill="#6c7b8b" rx="6"/><rect x="636.3" y="160.5" width="75.14" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><text x="680.5" y="199.5" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">full lane change</text><line x1="649.5" y1="312.5" x2="714.5" y2="312.5" stroke="#16365c" stroke-width="1.105" stroke-linecap="round"/><rect x="644.3" y="310.68" width="29.25" height="3.64" fill="#16365c" rx="1.8200000000000003"/><rect x="690.45" y="310.68" width="29.25" height="3.64" fill="#16365c" rx="1.8200000000000003"/><line x1="688.5" y1="300.8" x2="688.5" y2="324.2" stroke="#16365c" stroke-width="1.8200000000000003" stroke-linecap="round"/><rect x="666.14" y="302.88" width="5.72" height="19.24" fill="#16365c" rx="2.86" opacity="0.85"/><circle cx="669" cy="312.5" r="4.42" fill="#16365c"/></g><line x1="743" y1="234.5" x2="753" y2="234.5" stroke="#14866d" stroke-width="1"/><line x1="743" y1="296.25" x2="753" y2="296.25" stroke="#14866d" stroke-width="1"/><line x1="748" y1="234.5" x2="748" y2="296.25" stroke="#14866d" stroke-width="1"/><path d="M748 234.5 l -3 6 l 6 0 z" fill="#14866d"/><path d="M748 296.25 l -3 -6 l 6 0 z" fill="#14866d"/><text x="758" y="269.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#14866d" font-weight="bold">4¾ ft</text><text x="440" y="252.7" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" fill="#a15c00" font-weight="bold">the driver must cross the centre line to pass</text><rect x="432" y="593" width="396" height="96" fill="#fdf0d5" stroke="#a15c00" stroke-width="1.4" rx="4"/><text x="446" y="619" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#a15c00" font-weight="bold">The driver has to decide</text><text x="446" y="643" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">Overtaking now needs a gap in oncoming</text><text x="446" y="662" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">traffic. Drivers wait, and waiting is what</text><text x="446" y="681" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#202122">traffic calming actually is.</text><circle cx="853" cy="104" r="12" fill="#202122"/><text x="853" y="109" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="874" y="110" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#202122" font-weight="bold">Riding in formation</text><text x="840" y="134" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" fill="#54595d">Two riders hold the lane; a family bike tucks inside</text><g clip-path="url(#c3)"><rect x="840" y="150" width="396" height="91" fill="#dcdcd8"/><rect x="840" y="241" width="396" height="143" fill="#dcdcd8"/><rect x="840" y="384" width="396" height="65" fill="#e4f2ee"/><rect x="840" y="449" width="396" height="104" fill="#d0d0cb"/><rect x="840" y="553" width="396" height="22" fill="url(#hw)"/><line x1="840" y1="553" x2="1236" y2="553" stroke="#a2a9b1" stroke-width="2.5"/><line x1="840" y1="449" x2="1236" y2="449" stroke="#ffffff" stroke-width="3"/><line x1="840" y1="384" x2="1236" y2="384" stroke="#ffffff" stroke-width="3"/><line x1="840" y1="241" x2="1236" y2="241" stroke="#e8c44a" stroke-width="2.5" stroke-dasharray="18 12"/><rect x="848" y="468.5" width="208" height="78" fill="#6c7b8b" rx="6"/><rect x="910.4" y="472.5" width="70.72" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><rect x="1095" y="468.5" width="208" height="78" fill="#8a97a4" rx="6"/><rect x="1157.4" y="472.5" width="70.72" height="70" fill="#aab7c4" rx="4" opacity="0.85"/><rect x="840" y="423" width="396" height="45.5" fill="url(#hr)"/><rect x="840" y="267" width=