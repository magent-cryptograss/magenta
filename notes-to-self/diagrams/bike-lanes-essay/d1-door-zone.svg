33" y2="450" stroke="#54595d" stroke-width="1"/><line x1="128" y1="340" x2="128" y2="450" stroke="#54595d" stroke-width="1"/><path d="M128 340 l -3 6 l 6 0 z" fill="#54595d"/><path d="M128 450 l -3 -6 l 6 0 z" fill="#54595d"/><text x="118" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#202122" font-weight="bold" text-anchor="end">5 ft</text><text x="118" y="416" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#54595d" text-anchor="end">bike lane</text><line x1="123" y1="98" x2="133" y2="98" stroke="#54595d" stroke-width="1"/><line x1="123" y1="340" x2="133" y2="340" stroke="#54595d" stroke-width="1"/><line x1="128" y1="98" x2="128" y2="340" stroke="#54595d" stroke-width="1"/><path d="M128 98 l -3 6 l 6 0 z" fill="#54595d"/><path d="M128 340 l -3 -6 l 6 0 z" fill="#54595d"/><text x="118" y="224" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#202122" font-weight="bold" text-anchor="end">11 ft</text><text x="118" y="240" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#54595d" text-anchor="end">travel lane</text><line x1="844.21" y1="409.77" x2="878.21" y2="157.2" stroke="#b32424" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="878.21" y="111.2" width="300" height="96" fill="#fbe7e6" stroke="#b32424" stroke-width="1.2" rx="4"/><text x="891.21" y="132.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#202122" font-weight="bold">A door reaches 3½ ft from the car —</text><text x="891.21" y="151.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#202122" font-weight="normal">2 ft into the bike lane, along the whole</text><text x="891.21" y="170.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#202122" font-weight="normal">parking row, not only where a door</text><text x="891.21" y="189.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#202122" font-weight="normal">happens to be open right now.</text><rect x="178" y="692" width="28" height="16" fill="url(#hatchRed)" stroke="#b32424" stroke-width="1.2"/><text x="215" y="705" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#54595d">reach of an opening car door</text><rect x="526" y="692" width="28" height="16" fill="#e3ecfa" stroke="#3366cc" stroke-width="1.2"/><text x="563" y="705" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#54595d">where the rider actually is</text><rect x="874" y="692" width="28" height="16" fill="#e4f2ee" stroke="#14866d" stroke-width="1.2"/><text x="911" y="705" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#54595d">the painted bike lane</text><line x1="178" y1="730" x2="1142" y2="730" stroke="#c8ccd1" stroke-width="1"/><text x="178" y="764" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#202122" font-weight="bold">Measured from the curb face</text><text x="178" y="792" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#54595d">painted lane</text><text x="294" y="792" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#202122" font-weight="normal">8 ft – 13 ft</text><text x="178" y="816" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#54595d">door zone</text><text x="294" y="816" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#202122" font-weight="normal">6½ ft – 10 ft</text><text x="178" y="840" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#54595d">usable lane</text><text x="294" y="840" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" fill="#14866d" font-weight="bold">10 ft – 13 ft  =  3 ft</text><text x="648" y="764" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#202122" font-weight="bold">What those 3 ft have to hold</text><line x1="852" y1="772" x2="852" y2="864" stroke="#14866d" stroke-width="2" stroke-dasharray="5 4"/><rect x="648" y="778" width="204" height="30" fill="#e4f2ee" stroke="#14866d" stroke-width="1.5" rx="3"/><text x="750" y="798" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#14866d" font-weight="bold" text-anchor="middle">3 ft available</text><rect x="648" y="816" width="170" height="30" fill="#e3ecfa" stroke="#3366cc" stroke-width="1.5" rx="3"/><text x="733" y="836" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#3366cc" font-weight="bold" text-anchor="middle">2½ ft rider</text><rect x="818" y="816" width="204" height="30" fill="#fdf0d5" stroke="#a15c00" stroke-width="1.5" rx="3"/><text x="920" y="836" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#a15c00" font-weight="bold" text-anchor="middle">3 ft passing clearance</text><line x1="852" y1="860" x2="1022" y2="860" stroke="#b32424" stroke-width="2.5"/><text x="937" y="880" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#b32424" font-weight="bold" text-anchor="middle">short by 2½ ft</text><text x="178" y="938" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" fill="#72777d" font-style="italic">Door reach and rider envelope are typical values, not worst cases. Three feet is the passing clearance required by law in most US states.</text></svg>